name: Sync openclaw Image to ghcr.io

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        run: |
          for img in "ugreen/openclaw:latest" "ghcr.io/openclaw-dev/openclaw:latest" "quay.io/containerbuildstack/openclaw:latest"; do
            echo "Trying: $img"
            if docker pull "$img"; then
              if [ "$img" != "ugreen/openclaw:latest" ]; then
                docker tag "$img" ugreen/openclaw:latest
              fi
              echo "Pull success from $img"
              exit 0
            fi
            echo "Failed: $img, trying next..."
          done
          exit 1

      - name: Retag for ghcr.io
        run: |
          IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/openclaw:latest"
          docker tag ugreen/openclaw:latest $IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Push to ghcr.io
        run: docker push ${{ env.IMAGE_TAG }}
