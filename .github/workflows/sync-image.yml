name: Sync openclaw Image to ghcr.io

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and push via daocloud mirror
        run: |
          set -e
          MIRROR="docker.m.daocloud.io"
          SRC_IMAGE="ugreen/openclaw"
          DST_IMAGE="ghcr.io/${{ github.repository_owner }}/openclaw"
          
          echo "尝试从 daocloud 镜像拉取..."
          if docker pull ${MIRROR}/${SRC_IMAGE}:latest; then
            echo "daocloud 拉取成功"
            docker tag ${MIRROR}/${SRC_IMAGE}:latest ${DST_IMAGE}:latest
            docker push ${DST_IMAGE}:latest
            echo "推送至 ghcr.io 成功"
          else
            echo "daocloud 失败，尝试 Docker Hub 直连..."
            docker pull ${SRC_IMAGE}:latest
            docker tag ${SRC_IMAGE}:latest ${DST_IMAGE}:latest
            docker push ${DST_IMAGE}:latest
          fi
