name: Sync openclaw Image to ghcr.io

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          path: openclaw

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: openclaw
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/openclaw:latest
            ghcr.io/${{ github.repository_owner }}/openclaw:${{ github.run_number }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/openclaw:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/openclaw:buildcache,mode=max
