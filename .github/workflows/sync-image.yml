name: Sync openclaw Image to ghcr.io

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时检查一次

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image from Docker Hub
        run: docker pull ugreen/openclaw:latest

      - name: Retag for ghcr.io
        run: |
          IMAGE_TAG=$(docker inspect ugreen/openclaw:latest --format '{{index .RepoTags 0}}' | sed 's/ugreen\//ghcr.io\/${{ github.repository_owner }}\/openclaw-/')
          docker tag ugreen/openclaw:latest $IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Push to ghcr.io
        run: docker push ${{ env.IMAGE_TAG }}

      - name: Update latest tag
        run: |
          docker tag ugreen/openclaw:latest ghcr.io/${{ github.repository_owner }}/openclaw:latest
          docker push ghcr.io/${{ github.repository_owner }}/openclaw:latest
